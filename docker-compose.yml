# docker compose up                                -> dashboard on http://localhost:8080
# docker compose --profile observability up        -> + Prometheus :9090 and Grafana :3000
# AI insights with your local Ollama:  LLM_BASE_URL=http://host.docker.internal:11434/v1 LLM_MODEL=llama3.2:3b docker compose up
name: call-analytics

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calls
    # Published on localhost only, and on 5433 so it never clashes with a Postgres already running on the host.
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/10-readonly.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calls"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    image: call-analytics:local
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/calls
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SIM_ENABLED: "true"
      SIM_SEED: ${SIM_SEED:-42}
      SIM_BACKFILL_DAYS: ${SIM_BACKFILL_DAYS:-14}
      SIM_RATE_MULTIPLIER: ${SIM_RATE_MULTIPLIER:-1}
      DEV_TOOLS: "true"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000} # a local model on a laptop is slower (and loads on first use); hosted uses 8 s
      GRAFANA_URL: ${GRAFANA_URL:-}
    ports: ["${PORT:-8080}:8080"]
    volumes:
      - ./apps/api/evals:/app/evals # eval results and recordings land in the repo
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach Ollama on the host (needed on Linux; built in on Docker Desktop)
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:12.4.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-health.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
