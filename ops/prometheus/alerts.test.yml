# Unit tests for the alert rules: `promtool test rules ops/prometheus/alerts.test.yml` (CI runs it in Docker).
# Each test feeds synthetic metric series and checks which alerts fire, and when.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: API down pages after a minute, not on a single missed scrape
    interval: 1m
    input_series:
      - series: 'up{job="api", instance="api:8080"}'
        values: "1 1 0 1 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: ApiDown
        exp_alerts: []
      - eval_time: 6m
        alertname: ApiDown
        exp_alerts:
          - exp_labels: { severity: page, job: api, instance: "api:8080" }
            exp_annotations:
              summary: The API is not answering scrapes
              runbook: docs/RUNBOOK.md#api-down

  - name: rejected events above 1% open a ticket; duplicates and no-ops don't count
    interval: 1m
    input_series:
      - series: 'ingest_events_total{outcome="applied", reason=""}'
        values: "0+100x40"
      - series: 'ingest_events_total{outcome="duplicate", reason=""}'
        values: "0+50x40"
      - series: 'ingest_events_total{outcome="rejected", reason="unknown_campaign"}'
        values: "0x10 0+5x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: IngestRejectsHigh
        exp_alerts: []
      - eval_time: 35m
        alertname: IngestRejectsHigh
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "3.226% of ingested events are rejected (unknown campaign, identity mismatch, invalid transition)"
              runbook: docs/RUNBOOK.md#ingest-rejects

  - name: a healthy stream of duplicates never looks like rejects
    interval: 1m
    input_series:
      - series: 'ingest_events_total{outcome="applied", reason=""}'
        values: "0+100x40"
      - series: 'ingest_events_total{outcome="duplicate", reason=""}'
        values: "0+20x40"
      - series: 'ingest_events_total{outcome="rejected", reason="unknown_campaign"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: IngestRejectsHigh
        exp_alerts: []

  - name: a sustained 429 stream opens a ticket; a short burst does not
    interval: 1m
    input_series:
      - series: "ingest_rate_limited_events_total"
        values: "0x5 500x5 500+600x40"
    alert_rule_test:
      - eval_time: 12m
        alertname: IngestRateLimited
        exp_alerts: []
      - eval_time: 40m
        alertname: IngestRateLimited
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "An account has been over its ingest rate limit for 15 minutes (10 events/s refused)"
              runbook: docs/RUNBOOK.md#ingest-rate-limited
