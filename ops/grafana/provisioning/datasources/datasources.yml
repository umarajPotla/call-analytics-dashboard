apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData: { timeInterval: 5s }
  - name: Calls DB (read-only)
    uid: callsdb
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_reader
    secureJsonData: { password: grafana_reader }
    jsonData: { database: calls, sslmode: disable, postgresVersion: 1700, timescaledb: false }
