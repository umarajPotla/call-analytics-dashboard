# Alert routing, reviewed like code. Prometheus evaluates the rules in ops/prometheus/alerts.yml and sends firing
# alerts here; Alertmanager groups, deduplicates, silences and routes them by severity:
#   page   -> on-call (wake someone up: users are affected now)
#   ticket -> the team's channel (fix during working hours)
# The receivers are deliberately empty in this repo, so alerts show in the Alertmanager UI (localhost:9093) and go
# nowhere else. For a real deployment, uncomment the integrations and mount the secrets as files.
route:
  receiver: ticket
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers: ['severity="page"']
      receiver: page
      repeat_interval: 1h
    - matchers: ['severity="ticket"']
      receiver: ticket

inhibit_rules:
  # While the API is down, every other alert about it is noise: page once, for the cause.
  - source_matchers: ['alertname="ApiDown"']
    target_matchers: ['alertname!="ApiDown"']

